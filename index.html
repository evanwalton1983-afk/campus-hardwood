<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Hardwood</title>
<meta name="description" content="Campus Hardwood: college basketball game lines, ratings for every Division I team, price shopping and bet tracking.">
<meta name="theme-color" content="#1f1813">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Campus Hardwood">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --floor:#1f1813; --plank:#2a211a; --plank2:#33281f; --seam:#46382b; --seam2:#5a4a3a;
  --chalk:#f1e7d8; --dim:#b9a893; --faint:#8a7a68;
  --amber:#f0a630; --amber-ink:#2a1a05; --paint:#7aaee0; --brick:#e06a55;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:6px; --r:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--floor);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(64px + var(--safe-b));overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--paint)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num,.tab-n{font-variant-numeric:tabular-nums}
.cond{font-family:var(--cond);letter-spacing:.01em}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(31,24,19,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--seam);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top-row{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.mark{font-family:var(--cond);font-weight:700;font-size:24px;line-height:1;letter-spacing:.02em;display:flex;align-items:baseline;gap:8px}
.mark svg{width:22px;height:22px;align-self:center}
.mark small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--faint);letter-spacing:0}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.status{font-size:12px;color:var(--dim);text-align:right;line-height:1.25;white-space:nowrap}
.mark{white-space:nowrap}
@media (max-width:420px){.mark{font-size:21px}.mark svg{width:19px;height:19px}.status{font-size:11px}}
.status b{color:var(--chalk);font-weight:600}

/* Buttons */
.btn{border:1px solid var(--seam2);background:var(--plank2);border-radius:var(--r-sm);padding:8px 12px;font-weight:600;font-size:14px;line-height:1.1;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:1px solid var(--seam2);background:var(--plank2);border-radius:var(--r-sm);width:36px;height:36px;display:grid;place-items:center;padding:0}
.icon-btn svg{width:18px;height:18px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Layout */
main{max-width:1100px;margin:0 auto;padding:14px 16px 24px}
h1,h2,h3{font-family:var(--cond);font-weight:700;letter-spacing:.01em;margin:0}
h2{font-size:24px;line-height:1.1}
h3{font-size:18px;line-height:1.15}
.sub{color:var(--dim);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.section{margin:18px 0}
.panel{background:var(--plank);border:1px solid var(--seam);border-radius:var(--r);padding:14px}
.note{border-left:3px solid var(--paint);background:var(--plank);padding:10px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;color:var(--dim);font-size:14px}
.note.warn{border-left-color:var(--amber)}
.note.bad{border-left-color:var(--brick)}
.note b{color:var(--chalk)}
.empty{padding:28px 16px;text-align:center;color:var(--dim)}
.empty h3{color:var(--chalk);margin-bottom:6px}

/* Day strip */
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--seam);background:var(--plank);border-radius:var(--r-sm);padding:6px 12px;text-align:left;min-width:84px}
.day b{display:block;font-family:var(--cond);font-size:17px;font-weight:600}
.day span{font-size:12px;color:var(--dim)}
.day[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 -3px 0 var(--amber)}

/* Game cards */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.game{background:var(--plank);border:1px solid var(--seam);border-radius:var(--r);padding:12px 14px 12px;text-align:left;width:100%;display:block}
.game:hover{border-color:var(--seam2)}
.g-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin-bottom:8px;gap:8px}
.g-head .live{color:var(--amber);font-weight:600}
.tier{font-family:var(--cond);font-weight:700;font-size:13px;border:1px solid var(--seam2);border-radius:4px;padding:0 6px;color:var(--dim)}
.tier.A{color:var(--amber);border-color:var(--amber)}
.team-line{display:grid;grid-template-columns:1fr auto auto;align-items:baseline;gap:10px;padding:2px 0}
.team-name{font-family:var(--cond);font-weight:600;font-size:21px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.team-name small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--faint);margin-left:6px}
.team-proj{font-family:var(--cond);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim);min-width:36px;text-align:right}
.team-pct{font-family:var(--cond);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.team-line.fav .team-pct{color:var(--amber)}
.badges{display:inline-flex;gap:4px;margin-left:6px;vertical-align:2px}
.badge{font-family:var(--body);font-size:11px;font-weight:600;border-radius:4px;padding:1px 5px;background:var(--plank2);border:1px solid var(--seam2);color:var(--dim)}
.badge.hot{color:var(--amber);border-color:rgba(240,166,48,.5)}
.badge.bad{color:var(--brick);border-color:rgba(224,106,85,.5)}

/* The lane: signature probability bar */
.lane{position:relative;height:14px;margin:10px 0 6px;border-radius:3px;background:var(--plank2);border:1px solid var(--seam2);overflow:hidden}
.lane .fill{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,rgba(240,166,48,.92) 0 18px,rgba(226,150,38,.92) 18px 19px)}
.lane .mid{position:absolute;left:50%;top:-1px;bottom:-1px;width:2px;background:var(--floor);transform:translateX(-1px)}
.lane .circle{position:absolute;left:50%;top:50%;width:26px;height:26px;border:2px solid var(--floor);border-radius:50%;transform:translate(-50%,-50%);opacity:.55}
.lane .tick{position:absolute;top:-2px;bottom:-2px;width:3px;transform:translateX(-1.5px)}
.lane .tick.m{background:var(--paint)}
.lane .tick.k{background:var(--chalk)}
.lane-key{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);gap:8px}
.lane-key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.g-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--seam);gap:10px;font-size:13px}
.g-foot .lines{color:var(--dim)}
.g-foot .lines b{color:var(--chalk);font-weight:600}
.pick{font-weight:600;color:var(--amber);text-align:right}
.pick.none{color:var(--faint);font-weight:500}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--seam);border-radius:var(--r);background:var(--plank)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--seam)}
th{font-family:var(--cond);font-weight:600;font-size:14px;color:var(--dim);background:var(--plank2);position:sticky;top:0}
th[data-sort]{cursor:pointer}
th[data-sort][aria-sort]{color:var(--chalk)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;z-index:1}
td:first-child{background:var(--plank)}
tbody tr:hover td{background:var(--plank2)}
tbody tr:last-child td{border-bottom:0}
td.pos{color:var(--amber);font-weight:600}
td.neg{color:var(--brick)}
td.muted,span.muted{color:var(--faint)}
tr.click{cursor:pointer}

/* Sheet (game detail, modals) */
.scrim{position:fixed;inset:0;background:rgba(10,7,5,.6);z-index:40;display:none}
.scrim.open{display:block}
.sheet{visibility:hidden;position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--floor);border-top:1px solid var(--seam2);border-radius:14px 14px 0 0;padding:0 16px calc(24px + var(--safe-b));transform:translateY(105%);transition:transform .22s ease-out,visibility 0s linear .22s;max-width:860px;margin:0 auto}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease-out}
.sheet-head{position:sticky;top:0;background:var(--floor);padding:14px 0 10px;display:flex;align-items:flex-start;gap:10px;z-index:2;border-bottom:1px solid var(--seam)}
.sheet-head h2{font-size:26px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--seam2);margin:8px auto 0}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.spin svg{animation:none}}

/* Board */
.board td:first-child{font-weight:600}
.side-cell{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bet-cell .muted{font-size:13px}
.board .book{font-size:12px;color:var(--faint);font-weight:500}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{background:var(--plank);border:1px solid var(--seam);border-radius:var(--r-sm);padding:8px 10px}
.kv span{display:block;font-size:12px;color:var(--dim)}
.kv b{font-family:var(--cond);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.inj{list-style:none;margin:0;padding:0}
.inj li{display:flex;gap:8px;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--seam);font-size:14px}
.inj li:last-child{border-bottom:0}
.inj .st{font-weight:600}
.inj .st.out{color:var(--brick)}
.inj .st.q{color:var(--amber)}

/* Forms */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--dim);font-weight:500}
.field .hint{font-size:12px;color:var(--faint)}
input[type=text],input[type=number],input[type=password],input[type=url],select,textarea{background:var(--plank2);border:1px solid var(--seam2);border-radius:var(--r-sm);padding:9px 10px;width:100%;min-height:40px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--amber)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 12px}

/* Bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(31,24,19,.97);border-top:1px solid var(--seam);display:flex;justify-content:center;padding-bottom:var(--safe-b)}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--faint);font-size:11px;font-weight:600}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--amber)}
@media (min-width:900px){
  body{padding-bottom:0}
  nav.tabs{position:sticky;top:57px;bottom:auto;border-top:0;border-bottom:1px solid var(--seam);background:var(--floor)}
  nav.tabs .in{max-width:1100px;padding:0 16px;gap:4px;justify-content:flex-start}
  nav.tabs button{flex:0 0 auto;flex-direction:row;gap:7px;padding:10px 12px;font-size:14px;border-bottom:3px solid transparent}
  nav.tabs svg{width:18px;height:18px}
  nav.tabs button[aria-current="page"]{border-bottom-color:var(--amber)}
}
.toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-b));transform:translateX(-50%);background:var(--chalk);color:var(--floor);padding:9px 14px;border-radius:var(--r-sm);font-weight:600;font-size:14px;z-index:60;max-width:calc(100vw - 32px);display:none}
.toast.show{display:block}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--plank);border:1px solid var(--seam);border-radius:var(--r-sm);padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--dim)}
.stat b{font-family:var(--cond);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat b.pos{color:var(--amber)}
.stat b.neg{color:var(--brick)}
.stat small{display:block;font-size:12px;color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--seam2);border-radius:var(--r-sm);overflow:hidden}
.seg button{background:var(--plank);border:0;padding:6px 12px;font-size:13px;font-weight:600;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--plank2);color:var(--chalk);box-shadow:inset 0 -2px 0 var(--amber)}
.prose{max-width:72ch}
.prose p{margin:0 0 10px}
.wr-menu{display:flex;gap:6px;flex-wrap:wrap}
.filters select,.filters input{min-height:36px;padding:6px 10px;width:auto;flex:1 1 150px}
.filters .seg{flex:0 0 auto}
@media (max-width:420px){
  .team-name{font-size:19px}
  .games{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#f0a630" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#7aaee0"/><path d="M2 12h20M12 2v20M5 5c3 3 3 11 0 14M19 5c-3 3-3 11 0 14"/></svg>Campus Hardwood<small id="ver"></small></div>
    <div class="top-actions">
      <div class="status" id="status"></div>
      <button class="icon-btn" id="refreshBtn" title="Refresh data and prices" aria-label="Refresh data and prices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<main id="app" tabindex="-1"></main>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   Campus Hardwood
   College basketball game lines, team ratings for every Division I team,
   multi book price shopping, bet ledger with closing line value, and
   Send to War Room.
   ===================================================================== */
const VERSION = '1.0.0';
const SOURCE_APP = 'campus_hardwood';
const APP_NAME = 'Campus Hardwood';
const WAR_ROOM_DEFAULT = 'https://lighthearted-kringle-dafe7e.netlify.app/import/receive';

/* ---------- Model constants (fitted offline, see Season log > Backtest) ----------
   Ridge regularised offense and defense ratings on points for every D1 team,
   with all non D1 opponents pooled as one team. Settings chosen on 2021-22 and
   2022-23, checked on 2025-26.                                               */
const M = {
  HALF: 120,       // days: half life of the time decay on past games
  LAM: 3,          // ridge strength toward the carried prior, in game units
  CARRY: 0.6,      // share of last season's rating carried into the new season
  DAMP: 20,        // margins beyond 20 points count half
  B2B: 0,          // not used in college
  HCA0: 3.0,       // home court prior, points
  LAM_HCA: 30,     // ridge strength on home court
  MU0: 70,         // starting points per team prior for the oldest season loaded
  SD_ATS: 11.15,   // sd of actual margin around the closing spread
  SD_ML: 11.5,     // sd that maps a margin to a win probability
  SD_TOT: 16.69,   // sd of actual total around the closing total
  D1_MIN: 10,      // games this season for an unlisted team to count as D1
};
const BACKTEST = {
  lined: 15999, seasons: '2021-22, 2022-23 and 2025-26', results: '2020-21 to 2025-26',
  test: { label: '2025-26', n: 4528, rmseModel: 11.49, rmseMarket: 11.10, wMargin: 0.000, wMarginSe: 0.055, trmseModel: 17.17, trmseMarket: 16.80, wTotal: 0.135, wTotalSe: 0.060 },
  train: { label: '2021-22 and 2022-23', n: 8685, rmseModel: 11.19, rmseMarket: 10.91, wMargin: 0.110, wTotal: 0.112 },
  ats: [['0 to 1', 761, 719], ['1 to 2', 618, 579], ['2 to 3', 395, 378], ['3 to 4', 235, 236], ['4 to 6', 182, 181], ['6 plus', 126, 118]],
  tot: [['0 to 2', 841, 848], ['2 to 4', 656, 673], ['4 to 6', 423, 440], ['6 to 10', 287, 276], ['10 plus', 41, 43]],
  early: [['First 800 games', 13.60, 11.98], ['Games 800 to 1,500', 12.15, 11.99], ['Games 1,500 to 3,000', 11.79, 11.16], ['Games 3,000 to 4,500', 11.13, 10.88], ['Games 4,500 plus', 11.03, 10.90]],
  push: { spreadInt: 0.039, totalInt: 0.023 },
};

/* ---------- Teams: loaded from the bundled history file and ESPN ---------- */
const TEAM_BY_ID = {};      // id -> {id, name, loc, nick, short, abbr, conf}
const CONF_NAMES = {};      // ESPN group id -> short name
function addTeam(t) {
  const id = String(t.id); const old = TEAM_BY_ID[id] || {};
  TEAM_BY_ID[id] = { ...old, ...Object.fromEntries(Object.entries(t).filter(([, v]) => v != null && v !== '')), id };
  return TEAM_BY_ID[id];
}
const team = id => TEAM_BY_ID[String(id)] || { id: String(id), name: 'Team ' + id, loc: 'Team ' + id, short: 'Team ' + id, abbr: String(id).slice(0, 4), nick: '' };
const confOf = t => t && t.conf ? (CONF_NAMES[t.conf] || t.conf) : '';
/* Fuzzy team name key for matching the odds feed to ESPN */
const NAME_FIX = [[/\bst\.?\b/g, 'state'], [/\bsaint\b/g, 'st'], [/&/g, 'and'], [/\buniversity\b|\bof\b|\bthe\b/g, ''], [/[^a-z0-9 ]/g, ''], [/\s+/g, ' ']];
function nameKey(s) { let x = ' ' + String(s || '').toLowerCase().replace(/[.'’()-]/g, ' ') + ' '; for (const [re, r] of NAME_FIX) x = x.replace(re, r); return x.trim(); }
function nameScore(a, b) { // token overlap between two names, 0 to 1
  const A = new Set(nameKey(a).split(' ').filter(Boolean)), B = new Set(nameKey(b).split(' ').filter(Boolean));
  if (!A.size || !B.size) return 0; let k = 0; for (const x of A) if (B.has(x)) k++;
  return k / Math.max(A.size, B.size);
}
function teamNameScore(t, name) { return Math.max(nameScore(t.name, name), nameScore((t.loc || '') + ' ' + (t.nick || ''), name), nameKey(t.name) === nameKey(name) ? 1 : 0); }

/* ---------- Books ---------- */
const BOOKS = [['draftkings','DraftKings','DK'],['fanduel','FanDuel','FD'],['betmgm','BetMGM','MGM'],['williamhill_us','Caesars','CZR'],
  ['fanatics','Fanatics','FAN'],['betrivers','BetRivers','BR'],['espnbet','ESPN BET','ESPN'],['hardrockbet','Hard Rock Bet','HR'],
  ['ballybet','Bally Bet','BAL'],['betonlineag','BetOnline','BOL'],['lowvig','LowVig','LV'],['bovada','Bovada','BOV'],['mybookieag','MyBookie','MYB'],['betus','BetUS','BUS']];
const bookName = (k, title) => { const b = BOOKS.find(x => x[0] === k); return b ? b[1] : (title || k); };
const bookShort = (k, title) => { const b = BOOKS.find(x => x[0] === k); return b ? b[2] : (title || k || '').slice(0, 6); };

const DEFAULTS = {
  oddsKey: '', regions: 'us', myBooks: ['draftkings','fanduel','betmgm','williamhill_us','fanatics'],
  unit: 10, minEv: 0.03, staleHours: 3, slateDays: 3, wSide: 0.05, wTotal: 0.10,
  autoOddsMin: 60, showPreseason: false, warRoomUrl: WAR_ROOM_DEFAULT,
};

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fin = x => typeof x === 'number' && isFinite(x);

/* ---------- Slate ---------- */

function viewSlate() {
  const games = slateGames(S.day);

  if (R.games === 0) notes.push(`<div class="note"><b>The ${seasonLabel(S.curSeason)} season has not started.</b> Ratings are last season's, carried at ${Math.round(M.CARRY * 100)}%. The transfer portal and freshmen are invisible to them, and over the first 800 games of a season the model misses by 13.6 points against the market's 12.0. Lean on the market and on price shopping until December.</div>`);
  else if (R.games < 1500) notes.push(`<div class="note"><b>Early season.</b> ${R.games.toLocaleString()} games played so far. Ratings still lean on last season and miss the transfer portal; the model is at its weakest until about 1,500 games are in, usually early December.</div>`);

/* ---------- Market ---------- */

  ${rows.map(r => { const E = r.E; return `<tr class="click" data-game="${E.g.id}"><td>${esc(E.at.abbr)} at ${esc(E.ht.abbr)}</td><td>${fmtDay(E.g.ymd).split(',')[0]} ${fmtTime(E.g.date)}</td>
    <td>${fin(r.sp) ? lineStr(r.sp) : '<span class="muted">--</span>'}</td><td>${lineStr(Math.round(r.mm * 2) / 2)}</td><td class="${fin(r.gap) && Math.abs(r.gap) >= 4 ? 'pos' : ''}">${fin(r.gap) ? sgn(r.gap) : '--'}</td>

  </tbody></table></div>
  <p class="sub" style="margin-top:10px">Gap uses the pure model. Fair prices use the market plus ${Math.round(S.settings.wSide * 100)}% of the model on sides and ${Math.round(S.settings.wTotal * 100)}% on totals.</p>`;
}

/* ---------- Game sheet ---------- */
function openSheet(html) { const sh = $('#sheet'); sh.innerHTML = '<div class="grab"></div>' + html; sh.classList.add('open'); $('#scrim').classList.add('open'); sh.scrollTop = 0; const f = sh.querySelector('[data-autofocus]') || sh.querySelector('button'); f && f.focus({ preventScroll: true }); }

async function computeWF() {
  if (S.wf || S.wfBusy) return;
  S.wfBusy = true; render();
  const c = S.chain[S.curSeason]; let season = S.curSeason, src = c;
  if (!c.pg.length && S.chain[S.curSeason - 1]) { season = S.curSeason - 1; src = S.chain[season]; }
  const wf = await walkForward(src.pg, src.prior, S.nT, async p => { S.wfProgress = p; if (S.tab === 'log') render(); await sleep(0); });
  const out = { season, n: wf.length, su: 0, aeM: 0, aeT: 0, close: [], buckets: Array.from({ length: 5 }, () => ({ n: 0, p: 0, w: 0 })) };
  for (const r of wf) {
    const g = r.g, m = g.hp - g.ap, t = g.hp + g.ap, pm = r.proj.pm;
    if (Math.sign(pm) === Math.sign(m)) out.su++;
    out.aeM += Math.abs(pm - m); out.aeT += Math.abs(r.proj.pt - t);
    const p = 1 - Phi(-pm / M.SD_ML), b = Math.min(4, Math.floor(Math.abs(p - 0.5) * 10));
    out.buckets[b].n++; out.buckets[b].p += Math.max(p, 1 - p); out.buckets[b].w += (pm > 0) === (m > 0) ? 1 : 0;
    const h = g.id && S.hist[g.id];
    if (h && h.length) { const tip = gameResult(g.id); const cl = tip && [...h].reverse().find(x => x.t < Date.parse(tip.date)); if (cl && fin(cl.M)) out.close.push({ pm, cM: cl.M, m, pt: r.proj.pt, cT: cl.T, t }); }
  }
  S.wf = out; S.wfBusy = false; if (S.tab === 'log') render();
}

        b.closeLine = b.market === 'spread' ? (b.side === 'home' ? cl.spLine : -cl.spLine) : b.market === 'total' ? cl.toLine : null;

  return `<div class="row" style="margin-bottom:10px"><div><h2>Bets</h2><div class="sub">Graded automatically from ESPN finals. Closing line value uses the last price pull before tip.</div></div></div>
  <div class="stat-row">
    <div class="stat"><span>Record</span><b>${W}-${L}${Pu ? '-' + Pu : ''}</b><small>${all.length - done.length} open</small></div>
    <div class="stat"><span>Profit</span><b class="${pl > 0 ? 'pos' : pl < 0 ? 'neg' : ''}">${u(pl)}</b><small>$${(pl * S.settings.unit).toFixed(0)} at $${S.settings.unit} a unit</small></div>
    <div class="stat"><span>Return on risk</span><b>${risk ? sgnPct(pl / risk) : '--'}</b><small>${risk.toFixed(1)}u risked</small></div>
    <div class="stat"><span>Closing line value</span><b class="${clv > 0 ? 'pos' : clv < 0 ? 'neg' : ''}">${fin(clv) ? sgnPct(clv) : '--'}</b><small>${withClv.length} bet${withClv.length === 1 ? '' : 's'} with a close</small></div>
    <div class="stat"><span>From shopping</span><b>${fin(shop) ? sgnPct(shop) : '--'}</b><small>your price vs consensus when you bet</small></div>
    <div class="stat"><span>From line movement</span><b>${fin(move) ? sgnPct(move) : '--'}</b><small>consensus moving your way after</small></div>
  </div>
  <p class="sub" style="margin:10px 0">Over a season, closing line value tells you more than the win loss record. Shopping is the part you control; movement is the part that says whether your read was ahead of the market.</p>
  <div class="row" style="margin-bottom:10px"><div class="seg" role="group" aria-label="Filter bets">${[['open', 'Open'], ['settled', 'Settled'], ['all', 'All']].map(([k, l]) => `<button data-betfilter="${k}" aria-pressed="${S.betFilter === k}">${l}</button>`).join('')}</div><span class="spacer"></span><button class="btn small" data-act="exportAll">Back up</button></div>
  ${list.length ? `<div class="tbl-wrap"><table><thead><tr><th>Bet</th><th>Result</th><th>Profit</th><th>CLV</th><th>Price</th><th>Stake</th><th></th></tr></thead><tbody>
  ${list.map(b => `<tr><td class="bet-cell"><b>${esc(b.label)}</b><br><span class="muted">${esc(team(b.away).abbr)} at ${esc(team(b.home).abbr)}, ${fmtDay(b.ymd)}</span>${b.note ? `<br><span class="muted">${esc(b.note)}</span>` : ''}</td>
    <td>${res(b)}${b.final ? `<br><span class="muted">${esc(b.final)}</span>` : ''}</td>
    <td class="${b.pl > 0 ? 'pos' : b.pl < 0 ? 'neg' : ''}">${b.status === 'open' ? '--' : u(b.pl)}</td>
    <td class="${b.clv > 0 ? 'pos' : b.clv < 0 ? 'neg' : ''}">${fin(b.clv) ? sgnPct(b.clv) : '<span class="muted">pending</span>'}${fin(b.closeMinutes) ? `<br><span class="muted">${b.closeMinutes} min before tip</span>` : ''}</td>
    <td>${amStr(b.price)} <span class="muted">${esc(bookShort(b.book))}</span></td><td>${b.stake}u</td>
    <td><button class="btn small ghost" data-delbet="${b.id}" aria-label="Delete bet">Delete</button></td></tr>`).join('')}</tbody></table></div>`
    : `<div class="empty"><h3>${S.betFilter === 'open' ? 'No open bets' : 'Nothing here yet'}</h3><p>Open a game on the slate and tap Log next to the side you took.</p></div>`}`;
}

/* =====================================================================
   SEND TO WAR ROOM
   ===================================================================== */
function warRoomButtons() {
  return `<div class="wr-menu"><button class="btn primary" data-act="sendWR">Send to War Room</button><button class="btn small ghost" data-act="copyWR">Copy JSON</button><button class="btn small ghost" data-act="downloadWR">Download JSON</button></div>`;
}
function sentStatus() { return S.lastSent ? `<p class="sub" style="margin-top:12px">${esc(S.lastSent)}</p>` : ''; }
function buildPayload(ymd) {
  const st = S.settings, gen = new Date(now()).toISOString();
  const records = [];
  for (const g of slateGames(ymd)) {
    const E = evalGame(g); if (E.started) continue;
    const parts = [{ role: 'away', name: E.at.name, source_id: 'espn-' + E.at.id }, { role: 'home', name: E.ht.name, source_id: 'espn-' + E.ht.id }];
    for (const r of E.rows) {
      const flags = [...E.flags];
      const center = centerOf(r.market, E.fair);
      const b = r.best;
      const line = b ? b.line : r.line;
      const o = outcome(r.market, r.side, line, center);
      const rec = {
        record_id: `chncaab-${g.ymd}-${g.id}-${r.market}-${r.side}`,
        sport: 'NCAAB', league: 'NCAAB', season: S.curSeason, grouping: { type: 'date', label: g.ymd },
        event: { source_event_id: 'espn-' + g.id, start_time: new Date(g.date).toISOString(), timezone: 'America/New_York', neutral_site: !!g.neutral, venue: g.venue || null, participants: parts },
        market: { type: r.market === 'ml' ? 'moneyline' : r.market, period: 'full_game', participant_scope: null, is_alternate: false },
        selection: { side: r.side, label: sideLabel(E, r.market, r.side, line) },
        model: {
          prob_win: +o.win.toFixed(6), prob_push: +o.push.toFixed(6), prob_loss: +(1 - +o.win.toFixed(6) - +o.push.toFixed(6)).toFixed(6),
          projection: r.market === 'total' ? { kind: 'total', value: +E.proj.pt.toFixed(2) } : { kind: 'margin', value: +(r.side === 'away' ? -E.proj.pm : E.proj.pm).toFixed(2) },
          fair_line: r.market === 'spread' ? +(r.side === 'home' ? -E.fair.M : E.fair.M).toFixed(2) : r.market === 'total' ? +E.fair.T.toFixed(2) : null,
          fair_odds: Math.round(probToAm(condWin(o)) || 0) || null, confidence: E.tier,
          edge_supplied: b ? +b.ev.toFixed(5) : null,
        },
        flags,
      };
      if (r.market !== 'ml') {
        const lad = []; for (let x = line - 2; x <= line + 2 + 1e-9; x += 0.5) { const lo = outcome(r.market, r.side, x, center); lad.push({ line: +x.toFixed(1), prob_win: +lo.win.toFixed(6), prob_push: +lo.push.toFixed(6) }); }
        rec.model.ladder = lad;
      }
      if (b) rec.price = { line: r.market === 'ml' ? null : b.line, american_odds: b.price, opposite_american_odds: fin(b.opp) ? b.opp : null, sportsbook: bookName(b.book, b.bookTitle), captured_at: new Date(E.pricedAt || now()).toISOString() };
      else flags.push('no_price_in_app');
      if (E.stale && b) flags.push('stale_price');
      if (E.source === 'espn') flags.push('single_feed_price');
      records.push(rec);
    }
  }
  const stamp = gen.replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  return {
    contract: 'warroom.import', contract_version: '1.0',
    batch: {
      source_batch_id: `${SOURCE_APP}-${S.curSeason}-${ymd}-${stamp}`, source_app: SOURCE_APP, model_name: APP_NAME, model_version: VERSION,
      model_config: { model_weight_sides: st.wSide, model_weight_totals: st.wTotal, half_life_days: M.HALF, ridge: M.LAM, carry: M.CARRY, home_court_prior: M.HCA0, sd_margin: M.SD_ATS, sd_total: M.SD_TOT, sd_moneyline: M.SD_ML, my_books: st.myBooks },
      generated_at: gen, record_count: records.length, is_backfill: false,
    },
    records,
  };
}
function validatePayload(p) {
  const errs = [];
  if (!p.records.length) errs.push('No pregame markets on this day.');
  for (const r of p.records) {
    const m = r.model, s = m.prob_win + m.prob_push + m.prob_loss;
    if (Math.abs(s - 1) > 0.001) errs.push(`${r.record_id}: probabilities sum to ${s.toFixed(4)}`);
    if (![m.prob_win, m.prob_push, m.prob_loss].every(x => x >= 0 && x <= 1)) errs.push(`${r.record_id}: probability out of range`);
    if (!r.event.start_time || !r.event.participants.length) errs.push(`${r.record_id}: missing event details`);
    if (r.price && !fin(r.price.american_odds)) errs.push(`${r.record_id}: price without odds`);
  }
  return errs;
}
async function sendToWarRoom() {
  const p = buildPayload(S.day), errs = validatePayload(p);
  if (errs.length) { S.lastSent = 'Not sent. ' + errs.slice(0, 3).join(' '); render(); return; }
  let target; try { target = new URL(S.settings.warRoomUrl); } catch (e) { S.lastSent = 'The War Room address in Settings is not a valid URL.'; render(); return; }
  const win = window.open(target.href, '_blank');
  if (!win) { S.lastSent = 'Your browser blocked the War Room tab. Use Copy JSON or Download JSON instead.'; render(); return; }
  S.lastSent = `Waiting for The War Room to open (${p.records.length} records ready).`; render();
  let sent = false;
  const onMsg = ev => {
    if (ev.origin !== target.origin || !ev.data || typeof ev.data !== 'object') return;
    if (ev.data.type === 'warroom:ready' && !sent) { sent = true; win.postMessage({ type: 'warroom:payload', payload: p }, target.origin); }
    if (ev.data.type === 'warroom:received') { cleanup(); S.lastSent = `Sent ${ev.data.records ?? p.records.length} records. Finish the import in The War Room.`; render(); }
  };
  const cleanup = () => { window.removeEventListener('message', onMsg); clearTimeout(timer); };
  const timer = setTimeout(() => { cleanup(); if (!sent) { S.lastSent = 'The War Room did not answer within 60 seconds. Sign in there, or use Copy JSON or Download JSON.'; render(); } }, 60000);
  window.addEventListener('message', onMsg);
}
async function copyPayload() {
  const p = buildPayload(S.day), errs = validatePayload(p); if (errs.length) return toast(errs[0]);
  const txt = JSON.stringify(p, null, 2);
  try { await navigator.clipboard.writeText(txt); toast(`Copied ${p.records.length} records.`); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(`Copied ${p.records.length} records.`); } catch (x) { toast('Copy failed. Use Download JSON.'); } ta.remove(); }
}
function downloadText(name, txt) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function downloadPayload() {
  const p = buildPayload(S.day), errs = validatePayload(p); if (errs.length) return toast(errs[0]);
  downloadText(`warroom-${SOURCE_APP}-${S.day}-${p.batch.generated_at.replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z')}.json`, JSON.stringify(p, null, 2));
}

/* =====================================================================
   EVENTS AND STARTUP
   ===================================================================== */
async function refreshAll({ force = false, odds = false } = {}) {
  if (refreshAll.running) return; refreshAll.running = true; S.error = '';
  try {
    setBusy('Loading schedule');
    if (!S.history) { try { S.history = await loadHistory(); } catch (e) { S.error = 'The built in history file did not load. Ratings start from scratch until the season has games.'; S.history = { seasons: {}, teams: [] }; } }
    await ensureResults(force);
    await ensureSlate(force);
    computeChain(); render();
    const st = S.settings, games = allSlateGames().filter(g => g.state === 'pre');
    const age = S.odds ? now() - S.odds.t : Infinity;
    if (st.oddsKey && (odds || (games.length && +st.autoOddsMin > 0 && age > st.autoOddsMin * 60e3))) await pullOdds();
    if (S.odds) S.matches = matchAll(allSlateGames(), S.odds.events, S.oddsMemo);
    S.evals = {}; settleBets();
  } catch (e) { console.error(e); S.error = 'Refresh failed: ' + e.message; }
  finally { refreshAll.running = false; setBusy(''); render(); }
}
function readSettingsForm() {
  const st = { ...S.settings };
  st.oddsKey = $('#oddsKey').value.trim(); st.regions = $('#regions').value; st.autoOddsMin = +$('#autoOddsMin').value;
  st.myBooks = $$('[data-book]').filter(x => x.checked).map(x => x.dataset.book);
  st.minEv = clamp(parseFloat($('#minEv').value) / 100 || 0, 0, 0.5);
  st.staleHours = clamp(parseFloat($('#staleHours').value) || 3, 0.5, 48);
  st.wSide = clamp((parseFloat($('#wSide').value) || 0) / 100, 0, 1); st.wTotal = clamp((parseFloat($('#wTotal').value) || 0) / 100, 0, 1);
  st.unit = Math.max(1, parseFloat($('#unit').value) || 10); st.slateDays = clamp(parseInt($('#slateDays').value, 10) || 3, 1, 7);
  st.warRoomUrl = $('#warRoomUrl').value.trim() || WAR_ROOM_DEFAULT;
  return st;
}
document.addEventListener('click', async ev => {
  const t = ev.target.closest('button, a, [data-game]'); if (!t) return;
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; closeSheet(); render(); window.scrollTo(0, 0); return; }
  if (d.tabLink) { ev.preventDefault(); S.tab = d.tabLink; render(); return; }
  if (d.day) { S.day = d.day; S.lastSent = null; render(); return; }
  if (d.sort) { S.mkSort = { k: d.sort, d: S.mkSort.k === d.sort ? -S.mkSort.d : -1 }; render(); return; }
  if (d.betfilter) { S.betFilter = d.betfilter; render(); return; }
  if (d.filt) { S.filt[d.filt] = !S.filt[d.filt]; render(); return; }
  if (d.logbet) { openBetForm(S.openGame, +d.logbet); return; }
  if (d.delbet) { if (confirm('Delete this bet? This cannot be undone.')) { S.bets = S.bets.filter(b => b.id !== d.delbet); await saveBets(); render(); } return; }
  if (d.game && !d.act) { openGame(d.game); return; }
  switch (d.act) {
    case 'close': closeSheet(); break;
    case 'dismiss': S.error = ''; render(); break;
    case 'backToGame': openGame(S.openGame); break;
    case 'saveBet': await saveBet(d.game, +d.row); break;
    case 'saveAdj': {
      const id = S.openGame, m = parseFloat($('#adjM').value) || 0, tt = parseFloat($('#adjT').value) || 0, note = $('#adjN').value.trim();
      if (m || tt) S.adj[id] = { m, t: tt, note, at: now() }; else delete S.adj[id];
      await DB.set('adj', S.adj); S.evals = {}; toast(m || tt ? 'Adjustment saved.' : 'Adjustment cleared.'); openGame(id); render(); break;
    }
    case 'clearAdj': { const id = S.openGame; delete S.adj[id]; await DB.set('adj', S.adj); S.evals = {}; toast('Adjustment cleared.'); openGame(id); render(); break; }
    case 'sendWR': await sendToWarRoom(); break;
    case 'copyWR': await copyPayload(); break;
    case 'downloadWR': downloadPayload(); break;
    case 'saveSettings': {
      const before = S.settings.slateDays;
      S.settings = readSettingsForm(); saveSettings(S.settings); S.evals = {}; toast('Settings saved.');
      if (S.settings.slateDays !== before) await refreshAll({}); else render();
      break;
    }
    case 'resetSettings': if (confirm('Restore default settings? Your Odds API key is kept.')) { S.settings = { ...DEFAULTS, oddsKey: S.settings.oddsKey }; saveSettings(S.settings); S.evals = {}; render(); toast('Defaults restored.'); } break;
    case 'reloadAll': if (confirm('Download every saved game date from ESPN again? Late in the season that is about 150 requests.')) { for (const k of await DB.keys()) if (k.startsWith('day:')) await DB.del(k); S.dayData = {}; S.chain = null; render(); await refreshAll({ force: true }); } break;
    case 'clearPrices': if (confirm('Clear saved prices and price history? Closing line value for open bets will be lost.')) { S.odds = null; S.hist = {}; await DB.del('odds'); await DB.del('hist'); S.evals = {}; render(); } break;
    case 'exportAll': downloadText(`campus-hardwood-backup-${today()}.json`, JSON.stringify({ app: 'campus-hardwood', version: VERSION, exportedAt: new Date().toISOString(), bets: S.bets, adj: S.adj, hist: S.hist }, null, 2)); break;
  }
});
document.addEventListener('change', async ev => {
  if (ev.target.id === 'fConf') { S.filt.conf = ev.target.value; render(); return; }
  if (ev.target.id === 'rConf') { S.ratingConf = ev.target.value; render(); return; }
  if (ev.target.id === 'importFile') {
    const f = ev.target.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text()); if (j.app !== 'campus-hardwood' || !Array.isArray(j.bets)) throw new Error('not a Campus Hardwood backup');
      const ids = new Set(S.bets.map(b => b.id)); const add = j.bets.filter(b => !ids.has(b.id));
      S.bets = [...S.bets, ...add].sort((a, b) => b.placedAt - a.placedAt); S.adj = { ...j.adj, ...S.adj };
      for (const k in j.hist || {}) if (!S.hist[k]) S.hist[k] = j.hist[k];
      await saveBets(); await DB.set('adj', S.adj); await DB.set('hist', S.hist); settleBets(); S.evals = {};
      toast(`Restored ${add.length} bets.`); render();
    } catch (e) { toast('Could not restore: ' + e.message); }
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'fQ') { S.filt.q = ev.target.value; const pos = ev.target.selectionStart; render(); const el = $('#fQ'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } return; }
  if (ev.target.id === 'rq') { S.ratingQ = ev.target.value; const pos = ev.target.selectionStart; render(); const el = $('#rq'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#sheet').classList.contains('open')) closeSheet(); });
$('#scrim').addEventListener('click', closeSheet);
$('#refreshBtn').addEventListener('click', () => refreshAll({ force: true, odds: true }));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.chain) refreshAll({}); });

(async function init() {
  render();
  await loadCached();
  try { S.history = await loadHistory(); S.curSeason = seasonFor(today()); S.days = Array.from({ length: S.settings.slateDays }, (_, i) => addDays(today(), i)); S.day = S.days[0]; computeChain(); settleBets(); S.matches = S.odds ? matchAll(allSlateGames(), S.odds.events, S.oddsMemo) : new Map(); } catch (e) { S.chain = null; }
  render();
  await refreshAll({});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
